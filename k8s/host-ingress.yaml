apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: result-host-ingress
  namespace: voting-app
spec:
  ingressClassName: nginx
  rules:
    - host: result.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result
                port:
                  number: 80
